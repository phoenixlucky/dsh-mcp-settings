# MCP runtime providers are grouped for profile configuration.
- insert:
    - id: cognee-memory
      name: '@deepseek-ai/dsh-mcp-cognee-memory'
      config:
        enabled: false

    - id: mcp-chrome
      name: '@deepseek-ai/dsh-mcp-client/chrome'
      config:
        enabled: false

    - id: mcp-server-manager
      name: '@deepseek-ai/dsh-mcp-client/managed'
      config:
        servers:
          - id: new-gold
            serverName: new-gold
            enabled: true
            transport: streamable-http
            url: http://127.0.0.1:12888/new-gold
